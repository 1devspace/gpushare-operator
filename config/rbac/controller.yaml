apiVersion: v1
kind: Namespace
metadata:
  name: llc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-controller
  namespace: llc
---
# Everything the controller touches is namespaced, so a Role is enough;
# no cluster-wide grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elastic-controller
  namespace: llc
rules:
  - apiGroups: ["inference.gpushare.io"]
    resources: ["elasticmodels"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["inference.gpushare.io"]
    resources: ["elasticmodels/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  # update/patch: WriteProfileConfigMap falls back to Update on AlreadyExists.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elastic-controller
  namespace: llc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elastic-controller
subjects:
  - kind: ServiceAccount
    name: elastic-controller
    namespace: llc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elastic-controller
  namespace: llc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elastic-controller
  template:
    metadata:
      labels:
        app: elastic-controller
    spec:
      serviceAccountName: elastic-controller
      containers:
        - name: controller
          image: gpushare-elastic:latest
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=llc
            - --device-budget-mb=4096
            - --worker-url=http://llc-elastic-worker:8000
            - --interval=15s
            - --workspace-pvc=llc-code
            - --hf-cache-pvc=llc-hf
            - --gpu-devices
          env:
            - name: DEVICE_BUDGET_MB
              value: "4096"
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
