# ElasticModel: a model whose GPU footprint is a budget to adapt into,
# not a fixed reservation declared before admission.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticmodels.inference.gpushare.io
spec:
  group: inference.gpushare.io
  scope: Namespaced
  names:
    kind: ElasticModel
    plural: elasticmodels
    singular: elasticmodel
    shortNames: ["em"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["model", "memoryBudget"]
              properties:
                model:
                  type: string
                  description: HuggingFace repo id or local path.
                memoryBudget:
                  type: string
                  pattern: '^[0-9]+(Mi|Gi)$'
                latencySLO:
                  type: string
                  pattern: '^[0-9]+ms$'
                minThroughput:
                  type: number
                maxSessions:
                  type: integer
                  default: 1
                  minimum: 1
                maxContextTokens:
                  type: integer
                  default: 2048
                  minimum: 1
                priority:
                  type: integer
                  default: 0
                ttftSLO:
                  type: string
                  pattern: '^[0-9]+ms$'
                workload:
                  type: object
                  properties:
                    concurrency:
                      type: integer
                      default: 1
                      minimum: 1
                    expectedOutputTokens:
                      type: integer
                      default: 16
                      minimum: 1
                    requestsPerSwitch:
                      type: integer
                      default: 1
                      minimum: 1
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Profiling", "Ready", "Degraded", "Rejected"]
                reason:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                assigned:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: ["resident", "swap", "elastic"]
                    residentLayers:
                      type: integer
                    batch:
                      type: integer
                    predictedDriverMB:
                      type: number
                    predictedTokensPerSecond:
                      type: number
                    predictedStepMs:
                      type: number
                    kvReserveMB:
                      type: number
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Budget
          type: string
          jsonPath: .spec.memoryBudget
        - name: Mode
          type: string
          jsonPath: .status.assigned.mode
        - name: Layers
          type: integer
          jsonPath: .status.assigned.residentLayers
        - name: Phase
          type: string
          jsonPath: .status.phase
